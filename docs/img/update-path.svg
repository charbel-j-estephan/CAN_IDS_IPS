<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .t { fill: #f2f0eb; font-size: 15px; font-weight: 700; }
    .s { fill: #bcb8b0; font-size: 12.5px; }
    .m { fill: #8c8880; font-size: 11.5px; }
    .w { fill: #3ee6c0; font-size: 12px; }
    .box { fill: #0f0f0f; stroke: #333; stroke-width: 1.5; }
    .step { fill: #141414; stroke: #333; stroke-width: 1; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3ee6c0"/></marker></defs>
  <rect width="1200" height="560" fill="#0a0a0a"/>
  <text x="40" y="38" class="t" font-size="18">THE MODEL UPDATE · only the PC can sign, only the FPGA can read</text>
  <text x="40" y="58" class="m">A new model is a 4,174-byte file. Intercepting it on the way gives an encrypted file that cannot be read or changed.</text>

  <!-- PC -->
  <rect x="40" y="90" width="300" height="250" class="box"/>
  <text x="56" y="116" class="t">PC · THE SIGNER</text>
  <text x="56" y="138" class="m">holds the master key (never in git)</text>
  <g class="s">
    <text x="56" y="172">1 derive this board's keys</text>
    <text x="74" y="194">from the master key (AES-CMAC)</text>
    <text x="56" y="222">2 scramble the trees (AES-CTR,</text>
    <text x="74" y="244">new random IV per file)</text>
    <text x="56" y="272">3 stamp the whole file (AES-CMAC)</text>
    <text x="56" y="300">4 version = board's version + 1,</text>
    <text x="74" y="322">board ID in the header</text>
  </g>
  <line x1="340" y1="215" x2="438" y2="215" stroke="#3ee6c0" stroke-width="2" marker-end="url(#a)"/>
  <text x="389" y="205" class="w" text-anchor="middle">USB</text>

  <!-- STM32 -->
  <rect x="440" y="150" width="230" height="130" class="box" style="stroke:#de6a2e"/>
  <text x="456" y="176" class="t" style="fill:#de6a2e">STM32 · UPDATE TOOL</text>
  <text x="456" y="202" class="s">relays the file only</text>
  <text x="456" y="224" class="s">holds no key</text>
  <text x="456" y="250" class="m">a hacked STM32 cannot</text>
  <text x="456" y="266" class="m">make a valid file</text>
  <line x1="670" y1="215" x2="748" y2="215" stroke="#3ee6c0" stroke-width="2" marker-end="url(#a)"/>
  <text x="709" y="205" class="w" text-anchor="middle">SPI</text>

  <!-- FPGA -->
  <rect x="750" y="90" width="410" height="420" class="box" style="stroke:#4a8ce8"/>
  <text x="766" y="116" class="t" style="fill:#4a8ce8">DE10-LITE · CHECKS EVERYTHING</text>
  <text x="766" y="138" class="m">holds its own keys, any failed check = refused</text>
  <g>
    <rect x="766" y="152" width="378" height="30" class="step"/><text x="778" y="172" class="s">SW1 up? otherwise the port stays closed</text>
    <rect x="766" y="188" width="378" height="30" class="step"/><text x="778" y="208" class="s">CRC, length, format, board ID</text>
    <rect x="766" y="224" width="378" height="30" class="step"/><text x="778" y="244" class="s">version not below the floor in flash?</text>
    <rect x="766" y="260" width="378" height="30" class="step" style="stroke:#3ee6c0"/><text x="778" y="280" class="s" style="fill:#3ee6c0">CMAC stamp matches? checked twice</text>
    <rect x="766" y="296" width="378" height="30" class="step"/><text x="778" y="316" class="s">unscramble, tree ranges, test frames</text>
    <rect x="766" y="332" width="378" height="30" class="step"/><text x="778" y="352" class="s">write the spare flash slot, read back</text>
    <rect x="766" y="368" width="378" height="30" class="step"/><text x="778" y="388" class="s">journal record, swap between two frames</text>
  </g>
  <rect x="766" y="414" width="184" height="40" fill="#141414" stroke="#22a888"/>
  <text x="858" y="439" class="s" text-anchor="middle">SLOT A · LEDR4</text>
  <rect x="960" y="414" width="184" height="40" fill="#141414" stroke="#22a888"/>
  <text x="1052" y="439" class="s" text-anchor="middle">SLOT B · LEDR5</text>
  <text x="766" y="480" class="m">a power cut leaves the old model or the new one,</text>
  <text x="766" y="496" class="m">never half of one · stamp checked again at boot</text>

  <!-- refusals -->
  <rect x="40" y="380" width="630" height="130" fill="none" stroke="#e66767" stroke-dasharray="4 4"/>
  <text x="56" y="406" class="t" style="fill:#e66767">REFUSED, AND SHOWN IN THE LIVE DEMO</text>
  <g class="s">
    <text x="56" y="432">SW1 down → port closed</text>
    <text x="56" y="454">an older version → no rollback</text>
    <text x="56" y="476">signed with a wrong key → stamp mismatch, counted</text>
    <text x="56" y="498">3 bad stamps → port locked until a power cycle</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
