<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .t { fill: #f2f0eb; font-size: 15px; font-weight: 700; }
    .s { fill: #bcb8b0; font-size: 12.5px; }
    .m { fill: #8c8880; font-size: 11.5px; }
    .f { fill: #0a0a0a; font-size: 11px; font-weight: 700; }
  </style>
  <rect width="1200" height="520" fill="#0a0a0a"/>
  <text x="40" y="38" class="t" font-size="18">THE RACE · one CAN frame at 500 kbit/s (2 µs per bit)</text>
  <text x="40" y="58" class="m">The model needs the ID, the length and data bytes 0 to 4. The verdict has to land before the frame ends, or every ECU has already accepted it.</text>

  <!-- frame bar: x0=100, 9 px per bit, 8 data bytes, 108 bits, no stuff bits drawn -->
  <!-- fields: SOF1 ID11 ctrl3 DLC4 D0-4 40 | D5-7 24 CRC15 del1 ACK2 EOF7 -->
  <g>
    <rect x="100" y="110" width="9" height="40" fill="#6b6862"/>
    <rect x="109" y="110" width="99" height="40" fill="#bcb8b0"/><text x="158" y="135" class="f" text-anchor="middle">ID 11</text>
    <rect x="208" y="110" width="27" height="40" fill="#8c8880"/>
    <rect x="235" y="110" width="36" height="40" fill="#bcb8b0"/><text x="253" y="135" class="f" text-anchor="middle">DLC</text>
    <rect x="271" y="110" width="360" height="40" fill="#3ee6c0"/><text x="451" y="135" class="f" text-anchor="middle">DATA BYTES 0 TO 4 · what the model reads</text>
    <rect x="631" y="110" width="216" height="40" fill="#3d3d3d"/><text x="739" y="135" class="f" style="fill:#bcb8b0" text-anchor="middle">BYTES 5 TO 7</text>
    <rect x="847" y="110" width="135" height="40" fill="#2a2a2a"/><text x="914" y="135" class="f" style="fill:#bcb8b0" text-anchor="middle">CRC 15</text>
    <rect x="982" y="110" width="27" height="40" fill="#1c1c1c"/><text x="995" y="135" class="f" style="fill:#8c8880" text-anchor="middle">ACK</text>
    <rect x="1009" y="110" width="63" height="40" fill="#141414" stroke="#333"/><text x="1040" y="135" class="f" style="fill:#8c8880" text-anchor="middle">EOF</text>
  </g>
  <text x="100" y="100" class="m">SOF</text>

  <!-- the window -->
  <line x1="631" y1="88" x2="631" y2="470" stroke="#3ee6c0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="1018" y1="88" x2="1018" y2="470" stroke="#e66767" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="637" y="84" class="s" style="fill:#3ee6c0">byte 4 is in</text>
  <text x="1012" y="84" class="s" style="fill:#e66767" text-anchor="end">frame accepted, too late</text>
  <line x1="631" y1="175" x2="1018" y2="175" stroke="#f2f0eb" stroke-width="1"/>
  <path d="M631 175 l8 -4 v8 z M1018 175 l-8 -4 v8 z" fill="#f2f0eb"/>
  <rect x="744" y="165" width="160" height="20" fill="#0a0a0a"/>
  <text x="824" y="180" class="t" text-anchor="middle">86 µs to act</text>
  <text x="824" y="200" class="m" text-anchor="middle">at least 43 bit times</text>

  <!-- detectors -->
  <text x="40" y="250" class="t" style="fill:#4a8ce8">FPGA, hardcoded</text>
  <text x="40" y="268" class="s">80 ns, 4 clocks</text>
  <rect x="631" y="240" width="2" height="26" fill="#4a8ce8"/>
  <rect x="633" y="240" width="54" height="26" fill="#e66767" opacity=".9"/><text x="660" y="258" class="f" text-anchor="middle">FLAG</text>
  <text x="697" y="258" class="s">under 0.1 % of the window, then the flag</text>

  <text x="40" y="320" class="t" style="fill:#22a888">FPGA, updatable</text>
  <text x="40" y="338" class="s">300 ns, 15 clocks</text>
  <rect x="631" y="310" width="2" height="26" fill="#22a888"/>
  <rect x="633" y="310" width="54" height="26" fill="#e66767" opacity=".9"/><text x="660" y="328" class="f" text-anchor="middle">FLAG</text>
  <text x="697" y="328" class="s">the model is data, so it can be replaced in the field</text>

  <text x="40" y="390" class="t" style="fill:#de6a2e">STM32F407</text>
  <text x="40" y="408" class="s">60 to 94 µs worst run</text>
  <rect x="631" y="380" width="270" height="26" fill="#de6a2e"/>
  <rect x="901" y="380" width="153" height="26" fill="#de6a2e" opacity=".35"/>
  <text x="766" y="398" class="f" text-anchor="middle">60 µs</text>
  <text x="1060" y="398" class="s" style="fill:#de6a2e">94 µs</text>
  <text x="631" y="430" class="m">on the bench it still destroyed every attack frame, but its worst case reaches the edge</text>

  <text x="40" y="495" class="m">Drawn to scale for a frame with 8 data bytes. Stuff bits not drawn. Numbers: docs/PAPER_RESULTS.md.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
