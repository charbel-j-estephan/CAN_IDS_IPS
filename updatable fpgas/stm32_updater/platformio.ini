; STM32 update tool for the DE10-Lite: carries a signed model from the PC to the
; FPGA over SPI, then gets unplugged. It holds no keys and does no CAN.
; Separate from mcu/stm32_ids (fw 16), which is not changed.
;
; Upload over USB DFU, as fw 16: BOOT0 jumper (BT0 to 3V3), RST,
;   pio run -e black_f407ve_dfu -t upload
; then the jumper back to GND and RST.

[platformio]
default_envs = black_f407ve_dfu

[env]
platform = ststm32
board = black_f407ve_usb
framework = arduino
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -O2
build_unflags = -Os

[env:black_f407ve_dfu]
upload_protocol = dfu
