; Blink test for the STM32F407VET6 black board, no ST software needed.
; Open this folder in VS Code with the PlatformIO extension, then click Upload.
;
; Two ways to load the program. Only the default env runs on Upload.
;   black_f407ve_dfu : over the mini-USB cable, using the chip's built in bootloader
;   black_f407ve     : through an ST-LINK on the 20 pin debug header
[platformio]
default_envs = black_f407ve

[env]
platform = ststm32
board = black_f407ve
framework = arduino
monitor_speed = 115200

[env:black_f407ve_dfu]
upload_protocol = dfu

[env:black_f407ve]
upload_protocol = stlink
debug_tool = stlink
