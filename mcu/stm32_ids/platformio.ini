; STM32 IDS node, M1: CAN reception in software on the black STM32F407VE.
; Upload over USB DFU: BOOT0 jumper (BT0 to 3V3), RST, Upload, jumper back to
; GND, RST. See docs/STM32_WIRING.md.

[platformio]
default_envs = black_f407ve_dfu

[env]
platform = ststm32
; boards/black_f407ve_usb.json: the stock black_f407ve plus ST's USB IDs
; (the stock file has none, which would give the USB serial port VID 0).
board = black_f407ve_usb
framework = arduino
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    ; TIM4 and TIM2 are ours: keeps the core's HardwareTimer away from them
    -D HAL_TIM_MODULE_ONLY
    ; SysTick below the bit interrupt (0) and the model (1); USB is set to 2 in setup()
    -D TICK_INT_PRIORITY=2U
    ; the model runs from RAM: in flash it pushes the bit interrupt out of the flash cache
    -D MODEL_IN_RAM
    -O2
build_unflags = -Os

; The model that reads data bytes 0-4 (rf5-d9-p5-2ddda531), the default.
[env:black_f407ve_dfu]
upload_protocol = dfu

[env:black_f407ve]
upload_protocol = stlink
debug_tool = stlink

; The same firmware with a model that reads more data bytes, for the 5 / 6 / 8
; byte comparison. Upload one with: pio run -e black_f407ve_dfu_p6 -t upload
; READY and #STAT show which model runs (id=rf5-d9-p6-...).
[env:black_f407ve_dfu_p6]
upload_protocol = dfu
build_flags = ${env.build_flags} -D CAN_RX_FEATURE_BYTES=6

[env:black_f407ve_dfu_p8]
upload_protocol = dfu
build_flags = ${env.build_flags} -D CAN_RX_FEATURE_BYTES=8
