; STM32F407VET6 CAN gateway: every frame from CAN1 (bus 1) is forwarded
; unchanged to CAN2 (bus 2). No filtering, no detection.
;
; Upload over the mini-USB: BOOT0 jumper on (BT0 to 3V3), plug in, press RST,
; click Upload, then remove the jumper and press RST.
; Zadig driver for "STM32 BOOTLOADER" must be libusbK.
[platformio]
default_envs = gateway

[env:gateway]
platform = ststm32
board = black_f407ve
framework = arduino
upload_protocol = dfu
build_flags =
    -DHAL_CAN_MODULE_ENABLED
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DUSBCON
    -O2
