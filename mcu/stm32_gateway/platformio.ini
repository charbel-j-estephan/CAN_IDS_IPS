; STM32F407VET6 CAN gateway: CAN1 in, random forest, CAN2 out.
; Load it the same way as the blink test: BOOT0 jumper on, plug in, press RST,
; click Upload, then remove the jumper and press RST.
[platformio]
default_envs = gateway_dfu

[env]
platform = ststm32
board = black_f407ve
framework = arduino
build_flags =
    -DHAL_CAN_MODULE_ENABLED
    -O2

[env:gateway_dfu]
upload_protocol = dfu

[env:gateway_stlink]
upload_protocol = stlink
